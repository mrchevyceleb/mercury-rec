<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' blob:; script-src 'self'">
  <title>System Audio Recorder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="bg-mesh"><div class="bg-orb"></div></div>
    <div class="window-controls">
      <button class="win-btn win-settings" id="settingsBtn" aria-label="Settings">
        <svg viewBox="0 0 20 20" width="12" height="12" fill="currentColor">
          <path d="M11.5 2a1.5 1.5 0 00-3 0v.07a1.5 1.5 0 01-2.24 1.3l-.06-.04a1.5 1.5 0 00-2.12 2.12l.04.06a1.5 1.5 0 01-1.3 2.24H2.75a1.5 1.5 0 000 3h.07a1.5 1.5 0 011.3 2.24l-.04.06a1.5 1.5 0 002.12 2.12l.06-.04a1.5 1.5 0 012.24 1.3v.07a1.5 1.5 0 003 0v-.07a1.5 1.5 0 012.24-1.3l.06.04a1.5 1.5 0 002.12-2.12l-.04-.06a1.5 1.5 0 011.3-2.24h.07a1.5 1.5 0 000-3h-.07a1.5 1.5 0 01-1.3-2.24l.04-.06a1.5 1.5 0 00-2.12-2.12l-.06.04a1.5 1.5 0 01-2.24-1.3V2zM10 13a3 3 0 100-6 3 3 0 000 6z"/>
        </svg>
      </button>
      <button class="win-btn win-minimize" id="minimizeBtn" aria-label="Minimize"></button>
      <button class="win-btn win-close" id="closeBtn" aria-label="Close"></button>
    </div>
    <h1 class="title">System Audio Recorder</h1>

    <!-- Settings panel -->
    <div class="settings-panel" id="settingsPanel">
      <div class="settings-header">Settings</div>
      <div class="settings-row">
        <span class="settings-label">Save folder</span>
        <button class="settings-folder-btn" id="chooseFolderBtn">Choose...</button>
      </div>
      <div class="settings-folder-path" id="folderPathDisplay">Not set (will prompt each time)</div>
      <button class="settings-clear-btn" id="clearFolderBtn" disabled>Clear default folder</button>
    </div>

    <div class="audio-toggles">
      <div class="toggle-row">
        <span class="toggle-label">System Audio</span>
        <label class="toggle-switch">
          <input type="checkbox" id="systemAudioToggle" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="toggle-row">
        <span class="toggle-label">Microphone</span>
        <label class="toggle-switch">
          <input type="checkbox" id="micToggle">
          <span class="toggle-slider"></span>
        </label>
      </div>

      <div class="mic-preview" id="micPreview">
        <select id="micSelect" class="mic-select">
          <option value="">Loading devices...</option>
        </select>
        <div class="level-meter">
          <div class="level-meter-fill" id="levelMeterFill"></div>
        </div>
      </div>
    </div>

    <div class="recording-indicator" id="recordingIndicator">
      <span class="pulse-dot"></span>
      <span>REC</span>
    </div>

    <div class="timer" id="timer">00:00:00</div>

    <div class="controls">
      <button class="btn btn-record" id="recordBtn">Record</button>
      <button class="btn btn-stop" id="stopBtn" disabled>Stop</button>
    </div>

    <div class="status" id="status">Ready to record</div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
